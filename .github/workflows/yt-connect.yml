name: Connect YouTube channel

# Exchanges a one-time Google code (pushed to .github/yt-code/<brand>) for an
# encrypted refresh token in state/yt_<brand>.enc, then removes the code.
on:
  push:
    branches: [main]
    paths: [".github/yt-code/**"]

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Exchange codes
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          rc=0
          for f in .github/yt-code/*; do
            [ -f "$f" ] || continue
            python -m autopilot.ytstore "$(basename "$f")" || rc=1
          done
          exit $rc
      - name: Save
        if: always()
        run: |
          git config user.name "autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add -A state .github/yt-code
          git diff --cached --quiet || (git commit -m "Connect YouTube channel" && git push)
