name: Serve media for Instagram and TikTok

# Instagram and TikTok photo posts pull images from a public URL.
# This publishes the content/ folder to GitHub Pages whenever it changes.
on:
  push:
    branches: [main]
    paths: ["content/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check queue before publishing media
        run: pip install -r requirements.txt && python -m autopilot.main --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: content
      - id: deployment
        uses: actions/deploy-pages@v4
