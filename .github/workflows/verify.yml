name: Verify credentials

# Checks each account's keys without publishing anything.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/verify-request"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Instagram factyeap
        if: always()
        env:
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION }}
          FACTYEAP_IG_USER_ID: ${{ secrets.FACTYEAP_IG_USER_ID || '17841474070047497' }}
          FACTYEAP_IG_TOKEN: ${{ secrets.FACTYEAP_IG_TOKEN }}
        run: python -m autopilot.verify factyeap instagram
      - name: Instagram tinynotes
        if: always()
        env:
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION }}
          TINYNOTES_IG_USER_ID: ${{ secrets.TINYNOTES_IG_USER_ID || '17841453440786843' }}
          TINYNOTES_IG_TOKEN: ${{ secrets.TINYNOTES_IG_TOKEN }}
        run: python -m autopilot.verify tinynotes instagram
