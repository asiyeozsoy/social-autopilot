name: Verify credentials

# Checks each account's keys without publishing anything.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/verify-request"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Instagram factyeap
        if: always()
        env:
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION }}
          FACTYEAP_IG_USER_ID: ${{ secrets.FACTYEAP_IG_USER_ID || '17841474070047497' }}
          FACTYEAP_IG_TOKEN: ${{ secrets.FACTYEAP_IG_TOKEN }}
        run: python -m autopilot.verify factyeap instagram
      - name: Instagram tinynotes
        if: always()
        env:
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION }}
          TINYNOTES_IG_USER_ID: ${{ secrets.TINYNOTES_IG_USER_ID || '17841453440786843' }}
          TINYNOTES_IG_TOKEN: ${{ secrets.TINYNOTES_IG_TOKEN }}
        run: python -m autopilot.verify tinynotes instagram
      - name: Instagram upload test factyeap
        if: always()
        env:
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL || 'https://asiyeozsoy.github.io/social-autopilot' }}
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION }}
          FACTYEAP_IG_USER_ID: ${{ secrets.FACTYEAP_IG_USER_ID || '17841474070047497' }}
          FACTYEAP_IG_TOKEN: ${{ secrets.FACTYEAP_IG_TOKEN }}
        run: python -m autopilot.verify factyeap instagram-upload
      - name: Instagram upload test tinynotes
        if: always()
        env:
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL || 'https://asiyeozsoy.github.io/social-autopilot' }}
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION }}
          TINYNOTES_IG_USER_ID: ${{ secrets.TINYNOTES_IG_USER_ID || '17841453440786843' }}
          TINYNOTES_IG_TOKEN: ${{ secrets.TINYNOTES_IG_TOKEN }}
        run: python -m autopilot.verify tinynotes instagram-upload
      - name: Instagram reel test factyeap
        if: always()
        env:
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL || 'https://asiyeozsoy.github.io/social-autopilot' }}
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION }}
          FACTYEAP_IG_USER_ID: ${{ secrets.FACTYEAP_IG_USER_ID || '17841474070047497' }}
          FACTYEAP_IG_TOKEN: ${{ secrets.FACTYEAP_IG_TOKEN }}
        run: python -m autopilot.verify factyeap instagram-reel
      - name: Instagram reel test tinynotes
        if: always()
        env:
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL || 'https://asiyeozsoy.github.io/social-autopilot' }}
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION }}
          TINYNOTES_IG_USER_ID: ${{ secrets.TINYNOTES_IG_USER_ID || '17841453440786843' }}
          TINYNOTES_IG_TOKEN: ${{ secrets.TINYNOTES_IG_TOKEN }}
        run: python -m autopilot.verify tinynotes instagram-reel
      - name: Facebook factyeap
        if: always()
        env:
          META_SYSTEM_TOKEN: ${{ secrets.META_SYSTEM_TOKEN }}
          FACTYEAP_FB_PAGE_ID: ${{ secrets.FACTYEAP_FB_PAGE_ID || '633502523179601' }}
        run: python -m autopilot.verify factyeap facebook
      - name: Facebook tinynotes
        if: always()
        env:
          META_SYSTEM_TOKEN: ${{ secrets.META_SYSTEM_TOKEN }}
          TINYNOTES_FB_PAGE_ID: ${{ secrets.TINYNOTES_FB_PAGE_ID || '1465888266604099' }}
        run: python -m autopilot.verify tinynotes facebook
      - name: YouTube factyeap
        if: always()
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: python -m autopilot.verify factyeap youtube
      - name: YouTube tinynotes
        if: always()
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: python -m autopilot.verify tinynotes youtube
