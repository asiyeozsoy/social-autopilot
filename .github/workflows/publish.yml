name: Publish due posts

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show what would be published"
        type: boolean
        default: true

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Publish
        env:
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL || 'https://asiyeozsoy.github.io/social-autopilot' }}
          ENABLED_PLATFORMS: ${{ vars.ENABLED_PLATFORMS || 'instagram,facebook,youtube' }}
          TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY }}
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TINYNOTES_IG_USER_ID: ${{ secrets.TINYNOTES_IG_USER_ID || '17841453440786843' }}
          TINYNOTES_IG_TOKEN: ${{ secrets.TINYNOTES_IG_TOKEN }}
          TINYNOTES_YT_REFRESH_TOKEN: ${{ secrets.TINYNOTES_YT_REFRESH_TOKEN }}
          TINYNOTES_TT_REFRESH_TOKEN: ${{ secrets.TINYNOTES_TT_REFRESH_TOKEN }}
          FACTYEAP_IG_USER_ID: ${{ secrets.FACTYEAP_IG_USER_ID || '17841474070047497' }}
          FACTYEAP_IG_TOKEN: ${{ secrets.FACTYEAP_IG_TOKEN }}
          FACTYEAP_YT_REFRESH_TOKEN: ${{ secrets.FACTYEAP_YT_REFRESH_TOKEN }}
          FACTYEAP_TT_REFRESH_TOKEN: ${{ secrets.FACTYEAP_TT_REFRESH_TOKEN }}
          META_SYSTEM_TOKEN: ${{ secrets.META_SYSTEM_TOKEN }}
          FACTYEAP_FB_PAGE_ID: ${{ secrets.FACTYEAP_FB_PAGE_ID || '633502523179601' }}
          TINYNOTES_FB_PAGE_ID: ${{ secrets.TINYNOTES_FB_PAGE_ID || '1465888266604099' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m autopilot.main --dry-run
          else
            python -m autopilot.main
          fi
      - name: Save publish log
        if: always()
        run: |
          git config user.name "autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add state/published.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Publish log $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
